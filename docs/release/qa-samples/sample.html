<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QUILL HTML Import Sample</title>
</head>
<body>
  <h1>Trip Checklist</h1>
  <p>A small HTML document for the HTML-import and Paste-HTML-as-Markdown checks.
  It has one of each structure QUILL should carry across.</p>
  <ul>
    <li>Passport</li>
    <li>Tickets</li>
    <li>Charger</li>
  </ul>
  <table>
    <thead>
      <tr><th>Day</th><th>City</th></tr>
    </thead>
    <tbody>
      <tr><td>Monday</td><td>Lisbon</td></tr>
      <tr><td>Tuesday</td><td>Porto</td></tr>
    </tbody>
  </table>
  <p>See the <a href="https://example.com/quill">QUILL project</a> for details.</p>
  <img src="red-circle.png" alt="Red circle">
</body>
</html>
