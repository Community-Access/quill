[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "quill-inkwell"
version = "1.0.0"
description = "Quill Inkwell -- accessible, screen-reader-first abbreviation expansion in every Windows application, sharing one library with QUILL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Blind Information Technology Solutions (BITS)" },
  { name = "Community Access" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
]
# The whole app lives in the quill package (quill.apps.inkwell); this
# project is the thin product wrapper: entry point, docs, installer.
dependencies = ["quill[ui] @ git+https://github.com/Community-Access/quill.git"]

[project.gui-scripts]
quill-inkwell = "quill_inkwell:main"

[project.urls]
Homepage = "https://github.com/Community-Access/quill"
Upstream = "https://github.com/Community-Access/quill"

[tool.hatch.build.targets.wheel]
packages = ["quill_inkwell"]
