[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "quill-media-player"
version = "1.0.0"
description = "Quill Media Player -- accessible, screen-reader-first audiobook and media player as a standalone app"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Blind Information Technology Solutions (BITS)" },
  { name = "Community Access" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
]
# The whole app lives in the quill package (quill.apps.player); this project is
# the thin product wrapper: entry point, icon, installer.
dependencies = ["quill[ui] @ git+https://github.com/Community-Access/quill.git@main"]

[project.gui-scripts]
quill-media-player = "quill_media_player:main"

[project.urls]
Homepage = "https://github.com/Community-Access/quill"
Upstream = "https://github.com/Community-Access/quill"

[tool.hatch.build.targets.wheel]
packages = ["quill_media_player"]
