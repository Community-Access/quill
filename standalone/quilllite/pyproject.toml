[project]
name = "quilllite"
version = "0.1.0"
description = "A notepad and wordpad replacement for screen reader users, cut down from QUILL for All"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "wxPython>=4.2.5",
    "comtypes>=1.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pin the ruff settings QUILL uses, and name quilllite as first party so import
# ordering is the same whether this tree is linted on its own or from a repo
# root that does not know the package.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["quilllite"]
