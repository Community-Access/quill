name: release-feed-batch

# Turn one complete, source-SHA-labelled Dev build run into one Beta feed
# promotion. The first job has no feed seed. The second receives the seed only
# after the release-feed-signing Environment approves this workflow run.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact 40-character main SHA built by dev-builds.yml"
        type: string
        required: true
      dry_run:
        description: "Only run the all-app list and promotion checks"
        type: boolean
        default: true
      skip_soak:
        description: "Reason to bypass the one-day Dev soak (normally blank)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-feed-batch
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'Community-Access/quill' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ inputs.sha }}
      SKIP_SOAK: ${{ inputs.skip_soak }}
      REPORT_PATH: release-feed-batch-report.md
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install release tooling
        run: python -m pip install -e . pynacl
      - name: Check the complete Dev batch without a signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(--sha "$SOURCE_SHA" --dry-run --report "$REPORT_PATH")
          if [ -n "$SKIP_SOAK" ]; then ARGS+=(--skip-soak "$SKIP_SOAK"); fi
          python scripts/promote_release_batch.py "${ARGS[@]}"
      - name: Add the preflight audit to the summary
        if: always()
        run: |
          if [ -f "$REPORT_PATH" ]; then
            cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ always() && (inputs.dry_run || failure()) }}
        with:
          name: release-feed-batch-audit
          path: release-feed-batch-report.md
          if-no-files-found: warn

  promote:
    needs: preflight
    if: >-
      github.repository == 'Community-Access/quill' &&
      github.ref == 'refs/heads/main' &&
      inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: release-feed-signing
    permissions:
      contents: write
      pull-requests: write
    env:
      SOURCE_SHA: ${{ inputs.sha }}
      SKIP_SOAK: ${{ inputs.skip_soak }}
      REPORT_PATH: release-feed-batch-report.md
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install release tooling
        run: python -m pip install -e . pynacl
      - name: List and promote every Dev app, sequentially
        env:
          GH_TOKEN: ${{ secrets.DEV_BUILDS_TOKEN }}
          QUILL_FEED_SIGNING_KEY: ${{ secrets.QUILL_FEED_SIGNING_KEY }}
        run: |
          ARGS=(--sha "$SOURCE_SHA" --report "$REPORT_PATH")
          if [ -n "$SKIP_SOAK" ]; then ARGS+=(--skip-soak "$SKIP_SOAK"); fi
          python scripts/promote_release_batch.py "${ARGS[@]}"
      - name: Add the promotion audit to the summary
        if: always()
        run: |
          if [ -f "$REPORT_PATH" ]; then
            cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-feed-batch-audit
          path: release-feed-batch-report.md
          if-no-files-found: warn
      - name: Verify every signed feed and the signed index
        run: python scripts/feed_tool.py verify
      - name: Open one signed batch-feed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          PATHS=(docs/site/updates/v2 docs/release/promotions.log)
          if [ -z "$(git status --porcelain -- "${PATHS[@]}")" ]; then
            echo "::error::The batch changed no feed or promotion-log file."
            exit 1
          fi
          BRANCH="release/batch-feed-$RUN_ID"
          SHORT_SHA="${SOURCE_SHA:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "${PATHS[@]}"
          git commit -m "release: promote complete Dev batch to Beta"
          git push origin "$BRANCH"
          gh pr create \
            --head "$BRANCH" \
            --title "Promote verified Dev batch $SHORT_SHA to Beta" \
            --body "The owner-approved release-feed-signing job resolved every channel-enabled app from one Dev source SHA, promoted the exact release bytes to Beta, and verified every feed and the signed index."
