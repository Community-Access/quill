name: Accessibility rules tests

# Unit tests for .github/scripts/a11y-community.mjs, the logic behind
# accessibility-reports.yml and accessibility-credits.yml, run against a fake
# GitHub client. No dependencies and no network.

on:
  pull_request:
    paths:
      - ".github/scripts/a11y-*.mjs"
      - ".github/scripts/__tests__/a11y-community.test.mjs"
      - ".github/a11y-community.json"
      - ".github/workflows/a11y-community-tests.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/a11y-*.mjs"
      - ".github/scripts/__tests__/a11y-community.test.mjs"
      - ".github/a11y-community.json"
      - ".github/workflows/a11y-community-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Accessibility rules unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run the tests
        run: node --test .github/scripts/__tests__/a11y-community.test.mjs

      - name: Check the configuration loads
        run: node -e "import('./.github/scripts/a11y-community.mjs').then((m) => m.loadConfig('.github/a11y-community.json'))"
