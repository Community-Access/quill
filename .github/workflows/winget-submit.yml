name: WinGet manifests

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact published Stable release tag to prepare
        required: true
        type: string
      submit:
        description: Request the protected public submission job
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'release' && github.event.release.prerelease == false) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Quill
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the release-tag parser dependency
        run: python -m pip install packaging
      - name: Prepare and validate the local manifest set
        env:
          QUILL_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          QUILL_WINGET_OUTPUT: ${{ runner.temp }}/winget-manifests
        run: >-
          python -m scripts.winget.prepare
          --tag "$QUILL_RELEASE_TAG"
          --output "$QUILL_WINGET_OUTPUT"
      - name: Keep the prepared manifests for review
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifests-${{ github.event.release.tag_name || inputs.release_tag }}
          path: ${{ runner.temp }}/winget-manifests/manifests
          if-no-files-found: error

  submit:
    needs: prepare
    if: >-
      ${{ vars.WINGET_SUBMISSION_ENABLED == 'true' &&
          ((github.event_name == 'release' && github.event.release.prerelease == false) ||
           (github.event_name == 'workflow_dispatch' && inputs.submit == true)) }}
    runs-on: ubuntu-latest
    environment:
      name: winget-submission
    steps:
      - name: Check out Quill
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the release-tag parser dependency
        run: python -m pip install packaging
      - name: Submit one approved package version
        env:
          QUILL_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          WINGET_SUBMIT_TOKEN: ${{ secrets.WINGET_SUBMIT_TOKEN }}
        run: >-
          python -m scripts.winget.submit
          --tag "$QUILL_RELEASE_TAG"
          --submit
