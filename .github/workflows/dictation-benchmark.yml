# Dictation benchmark gate (scripts/dictation_speed_gate.py --run).
#
# Every model QUILL's dictation advice can recommend is run, on one processor
# thread, on the ten real recordings committed in tests/corpus/dictation
# (LibriVox readers, public domain, held out from every model's training). A
# model fails if it costs more than 1.5 times its catalogue figure, measured
# against Moonshine tiny on this same runner, or gets far more words wrong than
# the published figure. The ratio depends on the processor as well as the model
# (the first run, 2026-10-23, failed both Parakeet models here at 6 to 7 times
# Moonshine tiny, against about 4 on the measuring laptop), so a failure is a
# reason to re-measure the catalogue, not to loosen the tolerance. The data half of the
# gate (the advice keeps to its budget on every kind of computer) needs no
# models and runs in every PR CI shard.
#
# Weekly rather than per PR: the models are about 2 GB and come from their
# pinned, checksum-verified sources; they are cached between runs.
name: Dictation benchmark

on:
  workflow_dispatch:
  schedule:
    # Mondays at 06:41 UTC (offset avoids the top-of-hour rush).
    - cron: "41 6 * * 1"
  push:
    branches: [main]
    paths:
      - "quill/core/windows_dictation/model_catalog*.py"
      - "quill/core/windows_dictation/model_types.py"
      - "quill/core/windows_dictation/model_advice.py"
      - "scripts/dictation_speed_gate.py"
      - "tests/corpus/dictation/**"

permissions:
  contents: read

jobs:
  gate:
    name: Recommended models on real speech
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QUILL_DICTATION_BENCH: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install QUILL with the dictation engines
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,live-dictation]

      - name: Restore the models
        uses: actions/cache@v6
        with:
          path: |
            build/dictation-models
            ${{ runner.temp }}\dictation-downloads
          key: dictation-models-${{ hashFiles('quill/core/windows_dictation/model_catalog*.py', 'scripts/fetch_dictation_models.py') }}

      - name: Fetch the built-in and recommendable models
        env:
          QUILL_DICTATION_DOWNLOADS: ${{ runner.temp }}\dictation-downloads
        run: |
          python scripts/fetch_dictation_models.py
          python scripts/dictation_speed_gate.py --fetch --list

      - name: Run the gate
        env:
          QUILL_DICTATION_DOWNLOADS: ${{ runner.temp }}\dictation-downloads
        # --report-only (Jeff, 2026-10-24): the models' figures go to the job
        # summary and as warnings, not failures, until the costs are
        # re-measured on a real modest Windows computer; a shared cloud runner
        # is not the computers the advice is for. The advice's own budget rules
        # still fail the run.
        run: |
          python scripts/dictation_speed_gate.py --run --report-only
