name: promote-release

# Promote a listed build -- Dev to Beta, or Beta to Stable -- as the same files
# (release channels, plan 4.4). Nothing reaches Stable without a person
# pressing Approve: the Stable job runs in the GitHub Environment
# "stable-promotion", whose required reviewer is the owner.
#
# The feed signing seed remains a repository secret, but is delivered only to
# the protected promotion jobs after owner approval. The script reads it from
# QUILL_FEED_SIGNING_KEY in process memory; it is never written to a file or a
# command line. The job verifies every signature against the bundled public key
# before it opens the signed-feed pull request.
#
# The same script can run locally with the owner's key file:
#   python scripts/promote_release.py --app radio --version 3.3.0 --to stable
#
# Needs, in the repository settings: the Environment "stable-promotion" with
# the owner as required reviewer, and "Allow GitHub Actions to create and
# approve pull requests" (Settings > Actions > General) so the job can open
# the pull request. The existing QUILL_FEED_SIGNING_KEY secret is delivered
# only after the protected environment approves the promotion.
# docs/release/RELEASE.md, "Promotion".
#
# Every input reaches a script through env:, never pasted into it, so a
# version or a soak reason can never become shell.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Catalogue app key, for example weather"
        type: string
        required: true
      version:
        description: "Version, as listed in the feed (3.3.0)"
        type: string
        required: true
      to:
        description: "Promote to"
        type: choice
        options: [beta, stable]
      dry_run:
        description: "Only run the checks"
        type: boolean
        default: true
      skip_soak:
        description: "Reason for promoting before 7 days on Beta (recorded in the feed)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # One promotion of one app at a time: two would race on the same feed file.
  group: promote-${{ inputs.app }}
  cancel-in-progress: false

env:
  APP: ${{ inputs.app }}
  VERSION: ${{ inputs.version }}
  TO: ${{ inputs.to }}
  SKIP_SOAK: ${{ inputs.skip_soak }}

jobs:
  checks:
    if: github.repository == 'Community-Access/quill' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check the app is in the release catalogue
        run: |
          python -c "import os; from quill.core.release_catalog import BY_KEY; app=os.environ['APP']; assert app in BY_KEY and BY_KEY[app].channels_enabled, f'Unknown or held app: {app}'"
      - name: Check the version is one
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
            echo "::error::'$VERSION' is not a version (3.3.0, 3.3.0-beta.2, 3.3.0+2)."
            exit 1
          fi
      - name: Install
        run: python -m pip install -e . pynacl
      - name: Run every promotion check (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/promote_release.py \
            --app "$APP" --version "$VERSION" --to "$TO" \
            --skip-soak "$SKIP_SOAK" --dry-run --report promotion-report.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: promotion-report
          path: promotion-report.txt

  promote-beta:
    needs: checks
    if: ${{ !inputs.dry_run && inputs.to == 'beta' }}
    runs-on: ubuntu-latest
    environment: release-feed-signing
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e . pynacl
      - name: Promote to Beta and sign the feed
        env:
          GH_TOKEN: ${{ github.token }}
          QUILL_FEED_SIGNING_KEY: ${{ secrets.QUILL_FEED_SIGNING_KEY }}
        run: |
          python scripts/promote_release.py --app "$APP" --version "$VERSION" \
            --to beta --skip-soak "$SKIP_SOAK"
      - name: Verify the signed feeds
        run: python scripts/feed_tool.py verify
      - name: Open the signed feed pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="promote/$APP-$VERSION-beta"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add docs/site/updates/v2 docs/release/promotions.log
          git commit -m "release: $APP $VERSION to Beta"
          git push origin "$BRANCH"
          gh pr create --head "$BRANCH" --title "Promote $APP $VERSION to Beta" \
            --body "The protected release-feed-signing job promoted this build and verified every feed signature before opening this pull request."

  promote-stable:
    needs: checks
    if: ${{ !inputs.dry_run && inputs.to == 'stable' }}
    runs-on: ubuntu-latest
    environment: stable-promotion
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e . pynacl
      - name: Promote to Stable and sign the feed
        env:
          GH_TOKEN: ${{ github.token }}
          QUILL_FEED_SIGNING_KEY: ${{ secrets.QUILL_FEED_SIGNING_KEY }}
        run: |
          python scripts/promote_release.py --app "$APP" --version "$VERSION" \
            --to stable --skip-soak "$SKIP_SOAK"
      - name: Verify the signed feeds
        run: python scripts/feed_tool.py verify
      - name: Open the signed feed pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="promote/$APP-$VERSION-stable"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add docs/site/updates/v2 docs/release/promotions.log
          git commit -m "release: $APP $VERSION to Stable"
          git push origin "$BRANCH"
          gh pr create --head "$BRANCH" --title "Promote $APP $VERSION to Stable" \
            --body "The owner-approved stable-promotion job promoted this build and verified every feed signature before opening this pull request."
