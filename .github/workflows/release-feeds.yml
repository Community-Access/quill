name: release-feeds

# The v2 signing seed remains a GitHub secret. Only this owner-approved job,
# which checks out main, can receive it. It never appears in command arguments,
# files, logs or pull-request workflows.

on:
  workflow_dispatch:
    inputs:
      refresh_all:
        description: "Also refresh and re-sign every existing feed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-feeds
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'Community-Access/quill' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install release tooling
        run: python -m pip install -e . pynacl
      - name: Check the catalogue and migration plan
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_INPUT: ${{ inputs.refresh_all }}
        run: |
          ARGS=()
          if [ "$REFRESH_INPUT" = "true" ]; then ARGS=(--refresh-all); fi
          python -m quill.tools.release_catalog_audit
          python scripts/bootstrap_release_feeds.py --dry-run "${ARGS[@]}"

  sign:
    needs: preflight
    runs-on: ubuntu-latest
    environment: release-feed-signing
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install release tooling
        run: python -m pip install -e . pynacl
      - name: Bootstrap and sign every selected feed
        env:
          GH_TOKEN: ${{ github.token }}
          QUILL_FEED_SIGNING_KEY: ${{ secrets.QUILL_FEED_SIGNING_KEY }}
          REFRESH_INPUT: ${{ inputs.refresh_all }}
        run: |
          ARGS=()
          if [ "$REFRESH_INPUT" = "true" ]; then ARGS=(--refresh-all); fi
          python scripts/bootstrap_release_feeds.py "${ARGS[@]}"
      - name: Verify every feed and the signed index
        run: python scripts/feed_tool.py verify
      - name: Open the signed feed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain -- docs/site/updates/v2)" ]; then
            echo "No feed files changed."
            exit 0
          fi
          BRANCH="release/signed-feeds-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add docs/site/updates/v2
          git commit -m "release: create signed v2 feeds"
          git push origin "$BRANCH"
          gh pr create \
            --head "$BRANCH" \
            --title "Create signed v2 release feeds" \
            --body "Created by the owner-approved release-feed-signing workflow. Every feed and the index were verified against the bundled public key before this branch was opened."
