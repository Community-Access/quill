name: dev-builds

# Dev channel builds (release channels, owner decisions 2026-10-03):
#
# - built here, from main, at most once a day and only when main changed since
#   the last Dev build (scripts/dev_build_plan.py decides);
# - UNSIGNED (no Authenticode secret is used, so Windows may say "unknown
#   publisher"; the Dev risk window says so);
# - published to the separate repository Community-Access/quillville-dev-builds,
#   never to Community-Access/quill, whose first page of 30 releases is all that
#   installed Quill Radio 3.0.4 and QUILL Lite 1.1.2 ever read.
#
# The signed v2 feed is NOT written here: the feed key never lives in CI. The
# owner lists a Dev build on the Dev channel from their own computer:
#   python scripts/publish_release.py --app radio --version <v> --channel dev --existing
#
# Needs the repository secret DEV_BUILDS_TOKEN: a fine-grained token with
# "Contents: read and write" on Community-Access/quillville-dev-builds only.
# That repository must exist and have at least one commit on main (a README is
# enough): a release's tag is created on its main branch. Without the secret
# the "decide" job stops at once with an error, rather than building four apps
# it cannot publish. Cast's build also reads QUILL_PODCAST_INDEX_KEY and
# QUILL_PODCAST_INDEX_SECRET; without them Cast builds with no Podcast Index
# search (docs/release/RELEASE.md, "Dev builds").
#
# Every ${{ }} value reaches a script through env:, never pasted into it, so no
# input or computed version can become shell (actionlint's injection rule).
# Run only in Community-Access/quill: a fork has neither the secret nor the
# dev-builds repository.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if main has not changed or a build already ran today"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dev-builds
  cancel-in-progress: false

env:
  DEV_REPO: Community-Access/quillville-dev-builds

jobs:
  decide:
    if: github.repository == 'Community-Access/quill'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      reason: ${{ steps.plan.outputs.reason }}
      sha: ${{ steps.head.outputs.sha }}
      version_quill: ${{ steps.plan.outputs.version_quill }}
      version_quilllite: ${{ steps.plan.outputs.version_quilllite }}
      version_radio: ${{ steps.plan.outputs.version_radio }}
      version_cast: ${{ steps.plan.outputs.version_cast }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check the dev-builds token is set
        env:
          GH_TOKEN: ${{ secrets.DEV_BUILDS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The DEV_BUILDS_TOKEN secret is not set, so no Dev build could be published. See docs/release/RELEASE.md, Dev builds."
            exit 1
          fi
          gh api "repos/$DEV_REPO" --jq .full_name
      - name: The commit every job builds from
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Decide whether today's Dev build runs
        id: plan
        env:
          GH_TOKEN: ${{ secrets.DEV_BUILDS_TOKEN }}
          FORCE_INPUT: ${{ inputs.force }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          FORCE=()
          if [ "$FORCE_INPUT" = "true" ]; then FORCE=(--force); fi
          python scripts/dev_build_plan.py --sha "$SHA" --repo "$DEV_REPO" "${FORCE[@]}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: [quill, quilllite, radio, cast]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install build dependencies
        run: python -m pip install -e .[ui,spellcheck,dev] "pyinstaller>=6.22.3" "pyinstaller-hooks-contrib>=2026.7" "packaging>=25"
      - name: Install shared runtime dependencies for sibling apps
        if: matrix.app != 'quill'
        run: python -m pip install --find-links vendor/wheels -e ".[runtime,packaging]"
      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 -e --accept-package-agreements --accept-source-agreements --disable-interactivity
      - name: Stage pinned Pandoc for sibling documentation
        if: matrix.app != 'quill'
        shell: pwsh
        run: |
          # Match scripts/build_windows_distribution.py's pinned 3.10 archive.
          # winget's MSI succeeds but its per-user path is not visible to the
          # next runner step, where DocRender.ps1 resolves Pandoc.
          $archive = Join-Path $env:RUNNER_TEMP 'pandoc-3.10.zip'
          Invoke-WebRequest 'https://github.com/jgm/pandoc/releases/download/3.10/pandoc-3.10-windows-x86_64.zip' -OutFile $archive
          $expected = 'bb808d00fd58762299d64582a9b4c3e4b106cd929e62c5f19bcdcb496f1e54ae'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Pandoc archive checksum did not match the repository pin.'
          }
          $target = Join-Path $env:RUNNER_TEMP 'quill-pandoc'
          Expand-Archive -LiteralPath $archive -DestinationPath $target
          $pandoc = Get-ChildItem -LiteralPath $target -Filter pandoc.exe -File -Recurse | Select-Object -First 1
          if (-not $pandoc) { throw 'Pandoc archive contained no pandoc.exe.' }
          "QUILL_PANDOC=$($pandoc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Pick this app's Dev version
        id: ver
        shell: pwsh
        env:
          APP: ${{ matrix.app }}
          VERSION_QUILL: ${{ needs.decide.outputs.version_quill }}
          VERSION_QUILLLITE: ${{ needs.decide.outputs.version_quilllite }}
          VERSION_RADIO: ${{ needs.decide.outputs.version_radio }}
          VERSION_CAST: ${{ needs.decide.outputs.version_cast }}
        run: |
          $versions = @{
            quill = $env:VERSION_QUILL
            quilllite = $env:VERSION_QUILLLITE
            radio = $env:VERSION_RADIO
            cast = $env:VERSION_CAST
          }
          $version = $versions[$env:APP]
          if ($version -notmatch '^\d+\.\d+\.\d+-dev\.\d{8}\.\d+$') { throw "Not a Dev version: '$version'" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build QUILL (Dev, unsigned)
        if: matrix.app == 'quill'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $version = $env:VERSION
          $base = $version.Split('-')[0]
          $number = $version.Split('.')[-1]
          New-Item -ItemType Directory -Force build | Out-Null
          @"
          base_version = "$base"
          channel = "dev"
          prerelease_number = 0
          product_name = "QUILL for All"
          publisher = "Community Access"
          website = "https://quillforall.org"
          "@ | Set-Content -Encoding utf8 build/version.toml
          $env:QUILL_BUILD_NUMBER = $number
          python scripts/build_windows_distribution.py --bundle-python --compile-installer --output-dir dist/windows
          New-Item -ItemType Directory -Force dist/dev | Out-Null
          Get-ChildItem dist/windows/installer/Output/Quill-for-All-Setup-*.exe | Select-Object -First 1 | Copy-Item -Destination "dist/dev/Quill-for-All-Setup-$version.exe"
          Compress-Archive -Path dist/windows/portable/* -DestinationPath "dist/dev/Quill-Portable-$version.zip"
      - name: Build a sibling app (Dev, unsigned)
        if: matrix.app != 'quill'
        shell: pwsh
        env:
          APP: ${{ matrix.app }}
          VERSION: ${{ steps.ver.outputs.version }}
          QUILL_PODCAST_INDEX_KEY: ${{ secrets.QUILL_PODCAST_INDEX_KEY }}
          QUILL_PODCAST_INDEX_SECRET: ${{ secrets.QUILL_PODCAST_INDEX_SECRET }}
        run: |
          $version = $env:VERSION
          python scripts/fetch_build_deps.py
          $buildPython = python -c "import sys; print(sys.executable)"
          # -SkipCatalog is Quill Radio's alone (a Dev build browses live until
          # its first catalog refresh); the other build scripts have no such switch.
          $extra = @{}
          if ($env:APP -eq 'radio') { $extra['SkipCatalog'] = $true }
          & "standalone/$env:APP/scripts/build_release.ps1" -Python $buildPython -SkipPublishedCheck -DevVersion $version @extra
          New-Item -ItemType Directory -Force dist/dev | Out-Null
          $built = Get-ChildItem "standalone/$env:APP/dist" -File | Where-Object { $_.Name -like "*$version*" }
          if (-not $built) { throw "The build left no file named for $version in standalone/$env:APP/dist." }
          $built | Copy-Item -Destination dist/dev
      - uses: actions/upload-artifact@v7
        with:
          name: dev-${{ matrix.app }}
          path: dist/dev
          retention-days: 7

  publish:
    needs: [decide, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [quill, quilllite, radio, cast]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dev-${{ matrix.app }}
          path: dist/dev
      - name: Publish to the dev-builds repository
        env:
          GH_TOKEN: ${{ secrets.DEV_BUILDS_TOKEN }}
          APP: ${{ matrix.app }}
          SHA: ${{ needs.decide.outputs.sha }}
          VERSION_QUILL: ${{ needs.decide.outputs.version_quill }}
          VERSION_QUILLLITE: ${{ needs.decide.outputs.version_quilllite }}
          VERSION_RADIO: ${{ needs.decide.outputs.version_radio }}
          VERSION_CAST: ${{ needs.decide.outputs.version_cast }}
        run: |
          case "$APP" in
            quill) VERSION="$VERSION_QUILL"; TAG="v$VERSION"; NAME="QUILL" ;;
            quilllite) VERSION="$VERSION_QUILLLITE"; TAG="quill-lite-v$VERSION"; NAME="QUILL Lite" ;;
            radio) VERSION="$VERSION_RADIO"; TAG="quill-radio-v$VERSION"; NAME="Quill Radio" ;;
            cast) VERSION="$VERSION_CAST"; TAG="quill-cast-v$VERSION"; NAME="QUILL Cast" ;;
            *) echo "::error::Unknown app $APP"; exit 1 ;;
          esac
          # The commit every job built from (decide's), so the next run's
          # "has main changed?" compares against what was really built.
          (cd dist/dev && sha256sum -- * > SHA256SUMS.txt)
          printf 'Dev build of %s, unsigned. Built from Community-Access/quill@%s.\n\nNot listed on the Dev channel until the owner signs it into the feed.\n' "$NAME" "$SHA" > notes.md
          gh release create "$TAG" dist/dev/* \
            --repo "$DEV_REPO" \
            --target main \
            --title "$NAME $VERSION (Dev)" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
