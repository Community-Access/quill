name: dev-builds

# Dev channel builds (release channels, owner decisions 2026-10-03):
#
# - built here, from main, at most once a day and only when main changed since
#   the last Dev build (scripts/dev_build_plan.py decides);
# - UNSIGNED (no Authenticode secret is used, so Windows may say "unknown
#   publisher"; the Dev risk window says so);
# - published as files in ONE rolling prerelease of this repository, tagged
#   "dev-builds", so anyone can download them. A release per build would push
#   installed Quill Radio 3.0.4 and QUILL Lite 1.1.2's newest Stable build off the
#   first page of 30 releases that is all they read; one release takes one place
#   for good (quill/tools/dev_release.py, scripts/dev_release_finalize.py).
#
# The signed v2 feed is NOT written here: Dev artifacts and feed publication
# are separate approved jobs. A protected promote/listing run adds a Dev build
# after review:
#   python scripts/publish_release.py --app radio --version <v> --channel dev --existing
#
# No personal token is needed: the workflow's own token writes to this
# repository, and only the jobs that publish are given contents: write. Cast's
# build also reads QUILL_PODCAST_INDEX_KEY and QUILL_PODCAST_INDEX_SECRET;
# without them Cast builds with no Podcast Index search
# (docs/release/RELEASE.md, "Dev builds").
#
# Every ${{ }} value reaches a script through env:, never pasted into it, so no
# input or computed version can become shell (actionlint's injection rule).
# Run only in Community-Access/quill: a fork has none of the secrets.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if main has not changed or a build already ran today"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dev-builds
  cancel-in-progress: false

jobs:
  decide:
    if: github.repository == 'Community-Access/quill'
    runs-on: ubuntu-latest
    permissions:
      contents: write # makes the rolling Dev release once, before the uploads start
    outputs:
      build: ${{ steps.plan.outputs.build }}
      reason: ${{ steps.plan.outputs.reason }}
      sha: ${{ steps.head.outputs.sha }}
      apps: ${{ steps.plan.outputs.apps }}
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Make sure the rolling Dev release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dev_release_finalize.py --ensure --repo "$GITHUB_REPOSITORY"
      - name: The commit every job builds from
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Decide whether today's Dev build runs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_INPUT: ${{ inputs.force }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          FORCE=()
          if [ "$FORCE_INPUT" = "true" ]; then FORCE=(--force); fi
          python scripts/dev_build_plan.py --sha "$SHA" --repo "$GITHUB_REPOSITORY" "${FORCE[@]}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.decide.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install build dependencies
        run: python -m pip install -e .[ui,spellcheck,dev] "pyinstaller>=6.22.3" "pyinstaller-hooks-contrib>=2026.7" "packaging>=25"
      - name: Install shared runtime dependencies for sibling apps
        if: matrix.app != 'quill'
        run: python -m pip install --find-links vendor/wheels -e ".[runtime,packaging]"
      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 -e --accept-package-agreements --accept-source-agreements --disable-interactivity
      - name: Stage pinned Pandoc for sibling documentation
        if: matrix.app != 'quill'
        shell: pwsh
        run: |
          # Match scripts/build_windows_distribution.py's pinned 3.10 archive.
          # winget's MSI succeeds but its per-user path is not visible to the
          # next runner step, where DocRender.ps1 resolves Pandoc.
          $archive = Join-Path $env:RUNNER_TEMP 'pandoc-3.10.zip'
          Invoke-WebRequest 'https://github.com/jgm/pandoc/releases/download/3.10/pandoc-3.10-windows-x86_64.zip' -OutFile $archive
          $expected = 'bb808d00fd58762299d64582a9b4c3e4b106cd929e62c5f19bcdcb496f1e54ae'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Pandoc archive checksum did not match the repository pin.'
          }
          $target = Join-Path $env:RUNNER_TEMP 'quill-pandoc'
          Expand-Archive -LiteralPath $archive -DestinationPath $target
          $pandoc = Get-ChildItem -LiteralPath $target -Filter pandoc.exe -File -Recurse | Select-Object -First 1
          if (-not $pandoc) { throw 'Pandoc archive contained no pandoc.exe.' }
          "QUILL_PANDOC=$($pandoc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Pick this app's Dev version
        id: ver
        shell: pwsh
        env:
          APP: ${{ matrix.app }}
          VERSIONS_JSON: ${{ needs.decide.outputs.versions }}
        run: |
          $versions = $env:VERSIONS_JSON | ConvertFrom-Json -AsHashtable
          $version = [string]$versions[$env:APP]
          if ($version -notmatch '^\d+\.\d+\.\d+-dev\.\d{8}\.\d+$') { throw "Not a Dev version: '$version'" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build QUILL (Dev, unsigned)
        if: matrix.app == 'quill'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $version = $env:VERSION
          $base = $version.Split('-')[0]
          $number = $version.Split('.')[-1]
          New-Item -ItemType Directory -Force build | Out-Null
          @"
          base_version = "$base"
          channel = "dev"
          prerelease_number = 0
          product_name = "QUILL for All"
          publisher = "Community Access"
          website = "https://quillforall.org"
          "@ | Set-Content -Encoding utf8 build/version.toml
          $env:QUILL_BUILD_NUMBER = $number
          python scripts/build_windows_distribution.py --bundle-python --compile-installer --output-dir dist/windows
          New-Item -ItemType Directory -Force dist/dev | Out-Null
          Get-ChildItem dist/windows/installer/Output/Quill-for-All-Setup-*.exe | Select-Object -First 1 | Copy-Item -Destination "dist/dev/Quill-for-All-Setup-$version.exe"
          Compress-Archive -Path dist/windows/portable/* -DestinationPath "dist/dev/Quill-Portable-$version.zip"
      - name: Build a sibling app (Dev, unsigned)
        if: matrix.app != 'quill'
        shell: pwsh
        env:
          APP: ${{ matrix.app }}
          VERSION: ${{ steps.ver.outputs.version }}
          QUILL_PODCAST_INDEX_KEY: ${{ secrets.QUILL_PODCAST_INDEX_KEY }}
          QUILL_PODCAST_INDEX_SECRET: ${{ secrets.QUILL_PODCAST_INDEX_SECRET }}
        run: |
          $version = $env:VERSION
          python scripts/fetch_build_deps.py
          $buildPython = python -c "import sys; print(sys.executable)"
          # -SkipCatalog is Quill Radio's alone (a Dev build browses live until
          # its first catalog refresh); the other build scripts have no such switch.
          $extra = @{}
          if ($env:APP -eq 'radio') { $extra['SkipCatalog'] = $true }
          & "standalone/$env:APP/scripts/build_release.ps1" -Python $buildPython -SkipPublishedCheck -DevVersion $version @extra
          New-Item -ItemType Directory -Force dist/dev | Out-Null
          $built = Get-ChildItem "standalone/$env:APP/dist" -File | Where-Object { $_.Name -like "*$version*" }
          if (-not $built) { throw "The build left no file named for $version in standalone/$env:APP/dist." }
          $built | Copy-Item -Destination dist/dev
      - uses: actions/upload-artifact@v7
        with:
          name: dev-${{ matrix.app }}
          path: dist/dev
          retention-days: 7

  publish:
    needs: [decide, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads this app's files to the rolling Dev release
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.decide.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dev-${{ matrix.app }}
          path: dist/dev
      - name: Upload to the rolling Dev release
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
          VERSIONS_JSON: ${{ needs.decide.outputs.versions }}
        run: |
          IFS=$'\t' read -r VERSION TAG NAME < <(
            python -c "import json,os; from quill.core.release_catalog import product; p=product(os.environ['APP']); v=json.loads(os.environ['VERSIONS_JSON'])[p.key]; print(v, p.tag_prefix+v, p.name, sep='\\t')"
          )
          # This build's checksums are named for it, because every build's files
          # share the one release. The commit it came from is written into the
          # release notes afterwards, by the finalize job, once for all apps.
          (cd dist/dev && sha256sum -- * > "${TAG}.SHA256SUMS.txt")
          # --clobber: re-running a failed job uploads the same files again.
          gh release upload dev-builds dist/dev/* --repo "$GITHUB_REPOSITORY" --clobber

  finalize:
    # After the uploads, even if some apps failed: record the builds that arrived
    # and retire old ones. Never runs when nothing was built.
    needs: [decide, publish]
    if: ${{ always() && needs.decide.result == 'success' && needs.decide.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # writes the release notes and removes old Dev files
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Record the new builds and retire the old
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.decide.outputs.sha }}
        run: python scripts/dev_release_finalize.py --sha "$SHA" --repo "$GITHUB_REPOSITORY"
