# Support-to-engineering taxonomy, from the FreeScout/Postmark plan (v4,
# 2026-08-26). One shared repository serves all seven QUILL applications, so
# product identity is a label rather than a repository. An engineering issue
# raised from support carries exactly one product:* label unless the defect
# genuinely spans applications, plus one or more type:* labels and
# source:support. See docs/design/2026-08-26-feedback-redesign-for-freescout.md.
#
# These live here rather than being created by hand because this file is the
# source of truth: the sync workflow reconciles the repository against it, so a
# label that exists only on github.com is a label waiting to be removed.

